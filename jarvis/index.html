<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">
                <div class="logo-icon"></div>
                <span class="logo-text">JARVIS</span>
            </div>
        </div>
        <div class="nav-right">
            <button id="powerBtn" class="power-btn offline">
                <span class="power-icon"></span>
                <span class="power-text">OFFLINE</span>
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="main-container">
        <!-- JARVIS Circle (Heart/Brain) -->
        <div class="jarvis-center">
            <div class="jarvis-circle" id="jarvisCircle">
                <div class="circle-outer-ring"></div>
                <div class="circle-middle-ring"></div>
                <div class="circle-inner-core">
                    <div class="core-pulse"></div>
                </div>
                <div class="scanning-line"></div>
                <div class="orbital-dots">
                    <div class="dot dot-1"></div>
                    <div class="dot dot-2"></div>
                    <div class="dot dot-3"></div>
                </div>
            </div>
            <div class="status-text" id="statusText">System Offline</div>
        </div>

        <!-- Chat Interface -->
        <div class="chat-container" id="chatContainer" style="display: none;">
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be added here dynamically -->
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area" id="inputArea" style="display: none;">
            <div class="input-container">
                <input type="text" id="textInput" placeholder="Type your message or say 'Hey JARVIS'..." disabled>
                <button id="sendBtn" class="send-btn" disabled>
                    <span class="send-icon">→</span>
                </button>
                <button id="fileBtn" class="file-btn" disabled>
                    <span class="file-icon">📁</span>
                </button>
                <input type="file" id="fileInput" style="display: none;" accept=".txt,.html,.py,.js,.css,.json">
            </div>
            <div class="voice-indicator" id="voiceIndicator">
                <div class="voice-wave"></div>
                <div class="voice-wave"></div>
                <div class="voice-wave"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Added jarvis-identity.js before other scripts for proper initialization -->
    <script src="js/jarvis-identity.js"></script>
    <!-- Adding command-router.js for intelligent API routing -->
    <script src="js/command-router.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/jarvis-core.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/file-handler.js"></script>
    <script src="js/web-automation.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
